<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網址跳轉工具</title>
    <style>
        :root { --primary-color: #4A90E2; --bg-color: #f8f9fa; }
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-color: var(--bg-color); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
        .card { 
            background: white; padding: 40px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            width: 90%; max-width: 420px; text-align: center;
        }
        h2 { color: #333; margin-bottom: 25px; }
        .info-text { font-size: 14px; color: #666; margin-bottom: 15px; }
        input { 
            width: 100%; padding: 15px; margin-bottom: 20px; 
            border: 2px solid #ddd; border-radius: 12px; box-sizing: border-box; 
            font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary-color); }
        button { 
            width: 100%; padding: 15px; background-color: var(--primary-color); 
            color: white; border: none; border-radius: 12px; 
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; 
        }
        button:hover { background-color: #357ABD; transform: translateY(-2px); }
        
        .result-container { 
            margin-top: 30px; display: none; 
            animation: fadeIn 0.4s ease-out;
        }
        .final-link { 
            display: block; padding: 15px; background: #eef6ff; 
            color: var(--primary-color); text-decoration: none; 
            border-radius: 10px; word-break: break-all; font-weight: bold;
            border: 1px solid #d0e3ff; transition: 0.3s;
        }
        .final-link:hover { background: var(--primary-color); color: white; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>網址跳轉器</h2>
    <div class="info-text">輸入網址後自動附加 <code>/?df12=6636</code></div>
    <input type="text" id="urlInput" placeholder="在此貼上原始網址 (例如 google.com)">
    <button onclick="generateLink()">生成跳轉連結</button>

    <div id="resultContainer" class="result-container">
        <div class="info-text">點擊下方藍色區塊直接開啟：</div>
        <a id="finalUrl" href="#" target="_blank" class="final-link"></a>
    </div>
</div>

<script>
    const suffix = "/?df12=6636";

    function generateLink() {
        let input = document.getElementById('urlInput').value.trim();
        const container = document.getElementById('resultContainer');
        const linkElement = document.getElementById('finalUrl');

        if (!input) {
            alert("請輸入網址！");
            return;
        }

        // 1. 自動修正協定 (Protocol)
        if (!input.startsWith('http://') && !input.startsWith('https://')) {
            input = 'https://' + input;
        }

        // 2. 清理結尾斜線
        if (input.endsWith('/')) {
            input = input.slice(0, -1);
        }

        // 3. 拼接後綴並顯示
        const fullUrl = input + suffix;
        linkElement.href = fullUrl;
        linkElement.innerText = fullUrl;
        container.style.display = 'block';
    }
</script>

</body>
</html>
